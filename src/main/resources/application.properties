# Aplicação e documentação
quarkus.application.name=api-elixo
quarkus.http.port=${APP_PORT:8080}
quarkus.smallrye-openapi.info-title=API eLixo
quarkus.smallrye-openapi.open-api-version=3.1.1

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=19.0
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.max-size=16

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_TEST_NAME:elixo_db}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.test.integration-test-profile=test

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.database.default-schema=elixo

# Migrações
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.default-schema=public
quarkus.flyway.clean-disabled=true
%dev.quarkus.flyway.clean-disabled=false
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.migrate-at-start=true

# Firebase Admin
quarkus.google.cloud.project-id=${FIREBASE_PROJECT_ID:}
quarkus.google.cloud.service-account-location=${FIREBASE_SERVICE_ACCOUNT_PATH:}
